<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A7A7A"/></marker></defs><rect width="780" height="330" fill="#fff"/><text x="20" y="28" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1F1F1F" font-weight="700">Burst rule: 4 events of INVALID_SIG (medium) on one vehicle, window 60 min, threshold 3</text><line x1="60" y1="150" x2="740" y2="150" stroke="#7A7A7A" stroke-width="2"/><line x1="60.0" y1="145" x2="60.0" y2="155" stroke="#7A7A7A" stroke-width="1.5"/><text x="60.0" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959">0 min</text><line x1="216.92307692307693" y1="145" x2="216.92307692307693" y2="155" stroke="#7A7A7A" stroke-width="1.5"/><text x="216.92307692307693" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959">30 min</text><line x1="373.84615384615387" y1="145" x2="373.84615384615387" y2="155" stroke="#7A7A7A" stroke-width="1.5"/><text x="373.84615384615387" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959">60 min</text><line x1="530.7692307692307" y1="145" x2="530.7692307692307" y2="155" stroke="#7A7A7A" stroke-width="1.5"/><text x="530.7692307692307" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959">90 min</text><line x1="687.6923076923077" y1="145" x2="687.6923076923077" y2="155" stroke="#7A7A7A" stroke-width="1.5"/><text x="687.6923076923077" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959">120 min</text><rect x="60.0" y="88" width="235.38461538461536" height="44" rx="6" fill="#FBE9EC" stroke="#C8102E" stroke-width="1.6" stroke-dasharray="6 4"/><text x="177.69230769230768" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C8102E" font-weight="700">cluster: 3 events within 45 min (≤ 60 min)</text><circle cx="60.0" cy="110" r="9" fill="#C8102E"/><text x="60.0" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff" font-weight="700">1</text><circle cx="164.6153846153846" cy="110" r="9" fill="#C8102E"/><text x="164.6153846153846" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff" font-weight="700">2</text><circle cx="295.38461538461536" cy="110" r="9" fill="#C8102E"/><text x="295.38461538461536" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff" font-weight="700">3</text><circle cx="687.6923076923077" cy="110" r="9" fill="#9A9A9A"/><text x="687.6923076923077" y="114" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#fff" font-weight="700">4</text><text x="687.6923076923077" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#595959" font-style="italic">outside the window</text><rect x="60" y="215" width="300" height="86" rx="6" fill="#F3F3F3" stroke="#7A7A7A" stroke-width="1.2"/><text x="210.0" y="246.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1F1F1F">Result of the rule</text><text x="210.0" y="268.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#595959">1 alert &quot;3× INVALID_SIG within 45 min&quot;</text><text x="210.0" y="284.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#595959">event 4 is not part of it</text><rect x="400" y="215" width="340" height="86" rx="6" fill="#FBE9EC" stroke="#C8102E" stroke-width="1.2"/><text x="570.0" y="246.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#C8102E">Severity</text><text x="570.0" y="268.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C8102E">catalog severity medium, raised by one level</text><text x="570.0" y="284.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#C8102E">→ alert severity high (capped at high)</text></svg>