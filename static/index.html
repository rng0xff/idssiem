<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet IDS</title>
<link rel="icon" href="/assets/ineos-logo.png">
<link rel="stylesheet" href="/style.css">
<script src="/theme.js"></script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img class="logo" alt="INEOS" src="/assets/ineos-logo.png">Fleet IDS</div>
    <div class="doc" id="doc"></div>
    <a class="btn" href="#/data" title="Import events from an export file">Import data</a>
    <button class="btn ghost" id="btn-theme" title="Toggle dark mode">Theme</button>
  </header>
  <nav class="nav" id="nav">
    <h6>Analyse</h6>
    <a href="#/overview" data-r="overview">Overview</a>
    <a href="#/events" data-r="events">Events</a>
    <a href="#/vehicles" data-r="vehicles">Vehicles</a>
    <h6>Respond</h6>
    <a href="#/alerts" data-r="alerts">Alerts <span class="cnt" id="alert-badge" hidden></span></a>
    <h6>Configure</h6>
    <a href="#/detections" data-r="detections">Detections</a>
    <a href="#/catalog" data-r="catalog">Event catalog</a>
    <a href="#/data" data-r="data">Data</a>
  </nav>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>
<div id="toast" role="status"></div>
<script src="/core.js"></script>
<script src="/app.js"></script>
</body>
</html>
